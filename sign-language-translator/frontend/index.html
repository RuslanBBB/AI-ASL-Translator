<header class="header">
    <a class="logo" href="./">ASL-T</a>
    <button type="button">Аккаунт</button>
</header>

<main class="translator">
    <div class="mode-switch">
        <button type="button">Статические</button>
        <button type="button" disabled>Динамические</button>
    </div>

    <section class="camera-panel" aria-label="Камера">
        <video id="webcam" autoplay playsinline muted></video>
    </section>

    <section class="result-panel">
        <h2>Распознанный текст</h2>
        <p>Здесь появится текст</p>
    </section>

    <section class="result-panel">
        <h2>Перевод на русский</h2>
        <p>Здесь появится перевод</p>
    </section>
    
    <style>
    #webcam {
        transform: scaleX(-1);
        width: 640px;
        max-width: 100%;
    }
    </style>

    <button class="training-button" type="button">
        Тренировка
    </button>
</main>

<script src="js/camera.js"></script>
